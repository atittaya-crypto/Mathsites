<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมสำรวจห้องเรา</title>
<style>
:root{--bg:#fff8ec;--card:#ffffff;--tx:#2b2540;--mu:#6b6580;--pr:#6c4de6;--ok:#1f9d55;--bad:#d64545;--ln:#e6dcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a2b;--card:#2a2640;--tx:#f2eefc;--mu:#b3acc9;--pr:#9a82ff;--ok:#4cd38a;--bad:#ff7b7b;--ln:#40395c}}
:root[data-theme="dark"]{--bg:#1d1a2b;--card:#2a2640;--tx:#f2eefc;--mu:#b3acc9;--pr:#9a82ff;--ok:#4cd38a;--bad:#ff7b7b;--ln:#40395c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:17px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0}h2{font-size:21px;margin:4px 0}
.mu{color:var(--mu);margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:12px 0}
button{font:inherit;cursor:pointer}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:700;width:100%;margin-top:10px}
.btn.alt{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:999px;padding:5px 11px}
.chip.done{opacity:.35;text-decoration:line-through}
table{width:100%;border-collapse:collapse}
td{padding:7px 4px;border-bottom:1px solid var(--ln)}
.st{width:40px;height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:20px}
td b{display:inline-block;min-width:34px;text-align:center;font-size:20px}
tr.ok td{background:color-mix(in srgb,var(--ok) 15%,transparent)}
tr.bad td{background:color-mix(in srgb,var(--bad) 15%,transparent)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:15px}
.msg{font-weight:700;margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.big{font-size:56px;text-align:center}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');
const foods=[["🍳","ผัดกะเพรา"],["🍗","ข้าวมันไก่"],["🍜","ก๋วยเตี๋ยว"],["🍝","สปาเกตตี"],["🍕","พิซซ่า"]];
const bins=[[150,154],[155,159],[160,164],[165,169],[170,174],[175,179]];
const binName=b=>b[0]+"–"+b[1];
const R=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function start(){S={score:0,t0:Date.now()};lv1()}
function home(){
 app.onclick=e=>{if(e.target.id==='go')start()};
 app.innerHTML=`<div class="big">🕵️</div><h1>สำรวจห้องเรา</h1><p class="mu">เกมนักสืบข้อมูล: นับข้อมูลดิบ ทำตารางแจกแจงความถี่ ตอบคำถามให้ถูก แล้วเก็บคะแนนให้ได้มากที่สุด</p>
 <div class="card">2 ด่าน<br>ด่าน 1: นับเมนูอาหารกลางวัน<br>ด่าน 2: นับความสูงเป็นอันตรภาคชั้น</div><button class="btn" id="go">เริ่มเล่น</button>`}
function lv1(){
 let items,cnt;
 do{items=[];const w=shuf([6,5,4,3,2]);for(let i=0;i<22;i++){let r=R(20),k=0;while(r>=w[k]){r-=w[k];k++;if(k>4){k=0;r=0}}items.push(k)}
 cnt=foods.map((_,k)=>items.filter(x=>x===k).length);
 const m=Math.max(...cnt);if(cnt.filter(x=>x===m).length===1)break}while(1);
 countScreen({n:1,title:"ด่าน 1: เมนูอาหารกลางวันของห้อง",hint:"แตะข้อมูลที่นับแล้วเพื่อขีดฆ่า จากนั้นกด + − ใส่ความถี่ของแต่ละเมนู",
 labels:foods.map(f=>f[0]+" "+f[1]),items:items.map(k=>foods[k][0]+foods[k][1]),ans:cnt,
 qs:[{q:"เมนูไหนมีความถี่สูงสุด?",opts:foods.map(f=>f[1]),a:cnt.indexOf(Math.max(...cnt))},
 {q:"ผลรวมความถี่ควรเป็นเท่าไร?",...sumOpts(items.length)}],next:lv2})}
function lv2(){
 let h,cnt;
 do{h=[];for(let i=0;i<20;i++)h.push(150+Math.floor((R(30)+R(30))/2));h.sort((a,b)=>a-b);
 cnt=bins.map(b=>h.filter(x=>x>=b[0]&&x<=b[1]).length);
 const m=Math.max(...cnt);if(cnt.filter(x=>x===m).length===1)break}while(1);
 const lt=h.filter(x=>x<160).length;
 countScreen({n:2,title:"ด่าน 2: ความสูง (ซม.) ของเพื่อน 20 คน",hint:"จัดข้อมูลเข้าอันตรภาคชั้น ขั้นละ 5 ซม. แตะตัวเลขเพื่อขีดฆ่าตอนนับ",
 labels:bins.map(binName),items:shuf(h).map(String),ans:cnt,
 qs:[{q:"อันตรภาคชั้นไหนมีความถี่สูงสุด?",opts:bins.map(binName),a:cnt.indexOf(Math.max(...cnt))},
 {q:"มีคนสูงน้อยกว่า 160 ซม. กี่คน?",...numOpts(lt)}],next:finish})}
function numOpts(v){const o=shuf([...new Set([v,v+1,v+3,Math.max(0,v-2)])]);return{opts:o.map(String),a:o.indexOf(v)}}
function sumOpts(n){return numOpts(n)}
function countScreen(o){
 const c=o.labels.map(()=>0);let wrongs=0;
 app.innerHTML=`<div class="top"><span>${o.title.split(":")[0]}</span><span>คะแนน ${S.score}</span></div><h2>${o.title.split(": ")[1]}</h2><p class="mu">${o.hint}</p>
 <div class="card chips">${o.items.map((x,i)=>`<button class="chip" data-chip="${i}">${x}</button>`).join("")}</div>
 <div class="card"><table>${o.labels.map((l,i)=>`<tr id="r${i}"><td>${l}</td><td><button class="st" data-i="${i}" data-d="-1">−</button><b id="n${i}">0</b><button class="st" data-i="${i}" data-d="1">+</button></td></tr>`).join("")}
 <tr><td><b>รวม</b></td><td><b id="tot">0</b> / ${o.items.length}</td></tr></table></div>
 <div class="msg" id="msg"></div><button class="btn" id="chk">ตรวจคำตอบ</button>`;
 app.onclick=e=>{const t=e.target;
 if(t.dataset.chip!==undefined)t.classList.toggle("done");
 if(t.dataset.i!==undefined){const i=+t.dataset.i;c[i]=Math.max(0,c[i]+ +t.dataset.d);document.getElementById("n"+i).textContent=c[i];document.getElementById("tot").textContent=c.reduce((a,b)=>a+b,0)}
 if(t.id==="chk"){let ok=true;c.forEach((v,i)=>{const good=v===o.ans[i];if(!good)ok=false;document.getElementById("r"+i).className=good?"ok":"bad"});
 const m=document.getElementById("msg");
 if(ok){S.score+=Math.max(10,50-5*wrongs);m.textContent="ถูกต้องทั้งหมด! 🎉 ผลรวมความถี่เท่ากับจำนวนข้อมูลพอดี";t.textContent="ไปตอบคำถาม";t.id="nx"}
 else{wrongs++;m.textContent="ยังมีแถวที่ไม่ถูก (สีแดง) ลองนับใหม่อีกครั้ง";}}
 if(t.id==="nx")quiz(o.qs,0,o.next)}}
function quiz(qs,i,next){
 if(i>=qs.length)return next();
 const q=qs[i];let first=true;
 app.innerHTML=`<div class="top"><span>คำถามชวนคิด ${i+1}/${qs.length}</span><span>คะแนน ${S.score}</span></div><h2>${q.q}</h2>${q.opts.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join("")}<div class="msg" id="msg"></div>`;
 app.onclick=e=>{const t=e.target;
 if(t.dataset.k!==undefined){const k=+t.dataset.k;
 if(k===q.a){t.classList.add("ok");if(first)S.score+=10;document.getElementById("msg").innerHTML='ถูกต้อง! <button class="btn" id="nq">ต่อไป</button>'}
 else{first=false;t.classList.add("bad");document.getElementById("msg").textContent="ลองใหม่อีกครั้ง"}}
 if(t.id==="nq")quiz(qs,i+1,next)}}
function finish(){
 const sec=Math.round((Date.now()-S.t0)/1000),st=S.score>=120?3:S.score>=90?2:1;
 app.onclick=e=>{if(e.target.id==='again')start()};
 app.innerHTML=`<div class="big">${"⭐".repeat(st)}</div><h1 style="text-align:center">จบเกม!</h1>
 <div class="card">คะแนน <b>${S.score}</b> / 140<br>เวลา ${Math.floor(sec/60)} นาที ${sec%60} วินาที</div>
 <p class="mu">ชวนคิดต่อ: ข้อมูลดิบกับตารางแจกแจงความถี่ แบบไหนอ่านง่ายกว่า เพราะอะไร?</p><button class="btn" id="again">เล่นอีกรอบ (ข้อมูลชุดใหม่)</button>`}
home();
</script></body></html>
